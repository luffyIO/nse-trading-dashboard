name: Build desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            command: dist:win
            files: release/*.exe
          - platform: macos
            runner: macos-latest
            command: dist:mac
            files: release/*.dmg
          - platform: linux
            runner: ubuntu-latest
            command: dist:linux
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build installer
        run: npm run ${{ matrix.command }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: nse-dashboard-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: nse-dashboard-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" installers/* --title "$RELEASE_TAG" --generate-notes
